[project]
name = "morphcell-workspaces"
version = "0.1.0"
description = "Dataset preprocessing workspaces for MorphCell"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py>=3.12",
    "numpy>=2.0",
    "open3d>=0.19.0",
    "pandas>=2.2",
    "plotly>=6.0",
    "scikit-image>=0.25",
    "scipy>=1.14",
    "tifffile>=2025.1.10",
    "tqdm>=4.67",
    "trimesh>=4.6",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4",
]
